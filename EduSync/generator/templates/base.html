<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timetable Generator</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'dashboard' %}" class="nav-logo">
                <span class="logo-icon">🎓</span> EduSync
            </a>
            <div class="nav-links">
                <a href="{% url 'dashboard' %}" class="nav-item">Dashboard</a>
                <a href="{% url 'timetable' %}" class="nav-item">Timetable</a>
                <a href="{% url 'history' %}" class="nav-item">History</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2025 EduSync Scheduler. Built for L.J. University.</p>
    </footer>

    {% if messages %}
    <div id="msg-data" style="display:none;">
        {% for message in messages %}
        <span data-text="{{ message|escapejs }}"></span>
        {% endfor %}
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const msgElements = document.querySelectorAll('#msg-data span');
            msgElements.forEach(function (el) {
                alert(el.dataset.text);
            });
        });
    </script>
    {% endif %}
</body>

</html>
