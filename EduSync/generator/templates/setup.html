{% extends 'base.html' %}

{% block content %}
<div
    style="max-width: 600px; margin: 40px auto; padding: 30px; border: 1px solid var(--clr-border); border-radius: var(--radius); background: var(--clr-surface); box-shadow: var(--shadow-md);">
    <h2 style="text-align: center; color: var(--clr-text); font-family: var(--font-head);">Timetable Configuration</h2>
    <p style="text-align: center; color: var(--clr-text-muted); margin-bottom: 30px;">Initialize your department timetable structure.</p>

    <form method="post">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 20px;">
            {% for field in form %}
            <div style="display: flex; flex-direction: column;">
                <label style="font-weight: 600; margin-bottom: 5px; color: var(--clr-text); font-size: 0.9rem;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="color: #ef4444; font-size: 0.9em;">{{ field.errors }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <div style="margin-top: 30px; text-align: center;">
                <button type="submit"
                    onclick="return confirm('This will reset the current timetable structure. Continue?')"
                    style="padding: 12px 30px; background: var(--clr-accent); color: white; border: none; border-radius: var(--radius-sm); font-size: 16px; cursor: pointer; font-weight: 600;">Generate
                    Structure</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
